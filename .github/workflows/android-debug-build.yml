name: Android Debug Build

# Runs on every push to any branch, and can also be triggered manually
# from the Actions tab (workflow_dispatch).
on:
  push:
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # This project does not ship a gradlew wrapper, so we install the
      # exact Gradle version from gradle/wrapper/gradle-wrapper.properties
      # (9.3.1) and run `gradle` directly instead of `./gradlew`.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        # No .env / google-services.json is required for a debug build:
        # - the secrets plugin falls back to .env.example when .env is absent
        # - gradle.properties sets googleServices.missing.passthrough=true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quickdrop-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
